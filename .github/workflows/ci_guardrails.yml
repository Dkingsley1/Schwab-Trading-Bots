name: CI Guardrails

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install CLI smoke dependencies
        run: python -m pip install --disable-pip-version-check "python-dotenv==1.2.2" "pytest==9.0.3"

      - name: Python compile checks
        run: |
          python -m py_compile \
            scripts/secret_scan.py \
            scripts/dependency_guard.py \
            scripts/global_risk_killswitch.py \
            scripts/walk_forward_validate.py \
            scripts/walk_forward_promotion_gate.py \
            scripts/run_master_bot.py \
            scripts/run_execution_lane.py \
            scripts/shadow_watchdog.py \
            scripts/weekly_retrain.py \
            scripts/daily_auto_verify.py \
            scripts/promotion_readiness_summary.py \
            scripts/canary_diagnostics_loop.py \
            scripts/retire_persistent_losers.py \
            scripts/promotion_bottleneck_focus.py \
            scripts/canary_rollout_guard.py \
            scripts/paper_execution_calibration_report.py \
            scripts/promotion_quality_gate.py \
            scripts/new_bot_graduation_gate.py \
            scripts/leak_overfit_guard.py \
            scripts/model_lifecycle_hygiene.py \
            scripts/weekly_gate_blocker_report.py \
            scripts/observability_exporter.py \
            scripts/ops/command_validity_bot.py \
            scripts/ops/commands_hygiene_bot.py \
            scripts/ops/bot_organization_control.py \
            scripts/ops/bot_profitability_scalability_control.py \
            scripts/ops/master_grandmaster_evidence_control.py \
            scripts/ops/control_surface_ownership.py \
            scripts/ops/system_role_contract_control.py \
            scripts/ops/process_watchdog.py \
            scripts/ops/runtime_gate_dashboard.py \
            scripts/ops/system_self_model.py \
            scripts/ops/chaos_drill_coordinator.py \
            scripts/ops/artifact_freshness_slo.py \
            scripts/ops/use_mode_compliance_guard.py \
            scripts/ops/commercial_readiness_control.py \
            scripts/ops/live_canary_readiness_contract.py \
            scripts/ops/paper_400_ramp_control.py \
            scripts/ops/paper_live_data_standard.py \
            scripts/ops/production_hardening_watch.py \
            scripts/ops/independent_fill_evidence_acquisition.py \
            scripts/ops/promotion_candidate_advancement.py \
            scripts/ops/readiness_blocker_rollup.py \
            scripts/ops/readiness_evidence_accrual.py \
            scripts/ops/readiness_evidence_refresh.py \
            scripts/ops/production_flow_smoke.py \
            scripts/ops/infrabot_library_self_awareness_control.py \
            scripts/ops/production_level_upgrade_hardener_control.py \
            scripts/ops/production_quality_control.py \
            scripts/ops/production_quality_slo_guard.py \
            scripts/ops/production_excellence_control.py \
            scripts/ops/live_order_ledger_control.py \
            scripts/ops/live_canary_control.py \
            core/live_order_ledger.py \
            core/live_canary_allowlist.py \
            core/live_execution_controls.py \
            core/execution_lane_pipeline.py \
            core/system_role_contracts.py \
            core/bot_profitability_scalability.py \
            core/master_grandmaster_evidence.py \
            scripts/ops/production_recovery_drill_harness.py \
            scripts/ops/production_resilience_control.py \
            scripts/ops/profitability_evidence_firewall.py \
            scripts/ops/runtime_artifact_refresh.py \
            scripts/ops/runtime_throttle_control.py \
            scripts/ops/soak_reliability_sentinel.py \
            scripts/ops/soak_self_healing_control.py \
            scripts/ops/storage_disaster_recovery.py \
            scripts/ops/source_mutation_guard.py \
            scripts/ops/unattended_soak_readiness.py \
            scripts/ops/uniform_hardening_contract.py

      - name: CLI smoke (help)
        run: |
          python scripts/run_master_bot.py --help >/dev/null
          python scripts/weekly_retrain.py --help >/dev/null
          python scripts/daily_auto_verify.py --help >/dev/null
          python scripts/walk_forward_validate.py --help >/dev/null
          python scripts/walk_forward_promotion_gate.py --help >/dev/null
          python scripts/new_bot_graduation_gate.py --help >/dev/null
          python scripts/leak_overfit_guard.py --help >/dev/null
          python scripts/model_lifecycle_hygiene.py --help >/dev/null
          python scripts/weekly_gate_blocker_report.py --help >/dev/null
          python scripts/observability_exporter.py --help >/dev/null
          python scripts/ops/command_validity_bot.py --help >/dev/null
          python scripts/ops/commands_hygiene_bot.py --help >/dev/null
          python scripts/ops/bot_organization_control.py --help >/dev/null
          python scripts/ops/bot_profitability_scalability_control.py --help >/dev/null
          python scripts/ops/master_grandmaster_evidence_control.py --help >/dev/null
          python scripts/ops/control_surface_ownership.py --help >/dev/null
          python scripts/ops/system_role_contract_control.py --help >/dev/null
          python scripts/ops/chaos_drill_coordinator.py --help >/dev/null
          python scripts/ops/artifact_freshness_slo.py --help >/dev/null
          python scripts/ops/use_mode_compliance_guard.py --help >/dev/null
          python scripts/ops/commercial_readiness_control.py --help >/dev/null
          python scripts/ops/live_canary_readiness_contract.py --help >/dev/null
          python scripts/ops/paper_400_ramp_control.py --help >/dev/null
          python scripts/ops/paper_live_data_standard.py --help >/dev/null
          python scripts/ops/production_hardening_watch.py --help >/dev/null
          python scripts/canary_rollout_guard.py --help >/dev/null
          python scripts/paper_execution_calibration_report.py --help >/dev/null
          python scripts/promotion_quality_gate.py --help >/dev/null
          python scripts/ops/independent_fill_evidence_acquisition.py --help >/dev/null
          python scripts/ops/promotion_candidate_advancement.py --help >/dev/null
          python scripts/ops/readiness_blocker_rollup.py --help >/dev/null
          python scripts/ops/readiness_evidence_accrual.py --help >/dev/null
          python scripts/ops/readiness_evidence_refresh.py --help >/dev/null
          python scripts/ops/production_flow_smoke.py --help >/dev/null
          python scripts/ops/infrabot_library_self_awareness_control.py --help >/dev/null
          python scripts/ops/production_level_upgrade_hardener_control.py --help >/dev/null
          python scripts/ops/production_quality_control.py --help >/dev/null
          python scripts/ops/production_quality_slo_guard.py --help >/dev/null
          python scripts/ops/production_excellence_control.py --help >/dev/null
          python scripts/ops/live_order_ledger_control.py --help >/dev/null
          python scripts/ops/production_recovery_drill_harness.py --help >/dev/null
          python scripts/ops/production_resilience_control.py --help >/dev/null
          python scripts/ops/profitability_evidence_firewall.py --help >/dev/null
          python scripts/ops/runtime_artifact_refresh.py --help >/dev/null
          python scripts/ops/runtime_throttle_control.py --help >/dev/null
          python scripts/ops/soak_reliability_sentinel.py --help >/dev/null
          python scripts/ops/soak_self_healing_control.py --help >/dev/null
          python scripts/ops/storage_disaster_recovery.py --help >/dev/null
          python scripts/ops/source_mutation_guard.py --help >/dev/null
          python scripts/ops/unattended_soak_readiness.py --help >/dev/null
          python scripts/ops/uniform_hardening_contract.py --help >/dev/null

      - name: Resilience configuration validation
        run: |
          python -m json.tool config/control_surface_ownership_v1.json >/dev/null
          python -m json.tool config/system_role_contracts_v1.json >/dev/null
          python -m json.tool config/bot_organization_v1.json >/dev/null
          python -m json.tool config/bot_profitability_scalability_v1.json >/dev/null
          python -m json.tool config/master_grandmaster_evidence_v2.json >/dev/null
          python -m py_compile core/regime_taxonomy.py
          python -m py_compile core/bot_organization.py
          python -m py_compile core/bot_profitability_scalability.py
          python -m py_compile core/hierarchical_ensemble.py
          python -m py_compile core/master_grandmaster_evidence.py
          python -m json.tool config/production_resilience_v1.json >/dev/null
          python -m json.tool config/live_canary_micro_policy_v1.json >/dev/null
          python -m json.tool config/symbol_lifecycle_v1.json >/dev/null
          python -m json.tool config/sleeve_strategy_expansion.json >/dev/null

      - name: Hierarchical bot organization structural floor
        run: |
          python scripts/ops/bot_organization_control.py \
            --out-file /tmp/bot_organization_latest.json \
            --hierarchy-out governance/bot_organization/bot_hierarchy_latest.json \
            --json >/dev/null

      - name: System responsibility and authority structural floor
        run: |
          python scripts/ops/system_role_contract_control.py \
            --out-file /tmp/system_role_contract_latest.json \
            --json >/dev/null

      - name: Bot profitability and scalability structural floor
        run: |
          python scripts/ops/bot_profitability_scalability_control.py \
            --out-file /tmp/bot_profitability_scalability_latest.json \
            --manifest-out /tmp/bot_profitability_scalability_manifest_latest.json \
            --max-files 1 \
            --max-rows-per-file 100 \
            --json >/dev/null

      - name: Master and grand-master evidence structural floor
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          timestamp = datetime.now(timezone.utc).isoformat()
          Path("/tmp/master_paper_truth.json").write_text(json.dumps({
              "timestamp_utc": timestamp,
              "ok": True,
              "overall_status": "ready",
              "score": 100.0,
              "sleeve_scorecards": [],
          }))
          Path("/tmp/master_runtime_throttle.json").write_text(json.dumps({
              "timestamp_utc": timestamp,
              "ok": True,
              "overall_status": "advisory",
          }))
          PY
          python scripts/ops/master_grandmaster_evidence_control.py \
            --bot-organization-health /tmp/bot_organization_latest.json \
            --bot-hierarchy governance/bot_organization/bot_hierarchy_latest.json \
            --paper-truth /tmp/master_paper_truth.json \
            --runtime-throttle /tmp/master_runtime_throttle.json \
            --out-file /tmp/master_grandmaster_evidence_v2_latest.json \
            --packet-out /tmp/master_grandmaster_evidence_packets_v2_latest.json \
            --json >/dev/null

      - name: Gate smoke fixtures
        run: |
          cat > /tmp/walk_forward_fixture.json <<'JSON'
          {
            "timestamp_utc": "2026-02-25T00:00:00+00:00",
            "bots": {
              "brain_refinery_v10_seasonal": {
                "runs": 30,
                "train_mean": 0.58,
                "forward_mean": 0.57,
                "delta": -0.01,
                "trading_quality_score": 0.61,
                "overfit_gap": 0.01,
                "status": "pass"
              },
              "brain_refinery_v21_flash_crash": {
                "runs": 28,
                "train_mean": 0.56,
                "forward_mean": 0.55,
                "delta": -0.01,
                "trading_quality_score": 0.59,
                "overfit_gap": 0.01,
                "status": "pass"
              }
            }
          }
          JSON

          cat > /tmp/registry_fixture.json <<'JSON'
          {
            "sub_bots": [
              {"bot_id": "brain_refinery_v10_seasonal", "active": true, "model_path": "/tmp/m1.npz", "log_file": "/tmp/l1.json", "quality_score": 0.6, "test_accuracy": 0.57},
              {"bot_id": "brain_refinery_v21_flash_crash", "active": true, "model_path": "/tmp/m2.npz", "log_file": "/tmp/l2.json", "quality_score": 0.6, "test_accuracy": 0.55}
            ]
          }
          JSON

          touch /tmp/m1.npz /tmp/m2.npz /tmp/l1.json /tmp/l2.json

          python scripts/walk_forward_promotion_gate.py \
            --in-file /tmp/walk_forward_fixture.json \
            --out-file /tmp/promotion_gate_fixture.json \
            --min-runs-per-bot 6 \
            --min-considered-bots 2 \
            --min-forward-mean 0.50 \
            --min-delta -0.05 \
            --min-trading-quality-score 0.40 \
            --max-fail-share 0.5

          python scripts/new_bot_graduation_gate.py \
            --registry /tmp/registry_fixture.json \
            --walk-forward-file /tmp/walk_forward_fixture.json \
            --min-runs 6 \
            --min-forward-mean 0.50 \
            --min-delta -0.05 \
            --min-mature-bots 1 \
            --max-immature-active 0 \
            --out-file /tmp/new_bot_graduation_fixture.json

          python scripts/leak_overfit_guard.py \
            --walk-forward-file /tmp/walk_forward_fixture.json \
            --max-overfit-offenders 10 \
            --max-leak-offenders 10 \
            --out-file /tmp/leak_overfit_fixture.json

      - name: Production flow smoke
        run: |
          python scripts/ops/production_flow_smoke.py --json

      - name: Canary and soak regression contracts
        run: |
          python -m pytest -q \
            tests/test_live_canary_allowlist.py \
            tests/test_live_execution_controls.py \
            tests/test_system_role_contracts.py \
            tests/test_live_canary_control.py \
            tests/test_readiness_blocker_rollup.py \
            tests/test_sleeve_ticker_universe_expansion.py \
            tests/test_symbol_lifecycle.py

      - name: Uniform hardening structural floor
        run: |
          python scripts/ops/uniform_hardening_contract.py --structural-only --json

      - name: Source mutation guard
        run: |
          python scripts/ops/source_mutation_guard.py --check-clean --json

      - name: Secret scan
        run: |
          python scripts/secret_scan.py

      - name: Dependency guard (non-blocking snapshot in CI)
        run: |
          python scripts/dependency_guard.py || true
